  <link rel="stylesheet" crossorigin href="/assets/index-CSJArYXI.css">

<body>
  <div id="root"></div>
  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      // Only show if the root is empty (meaning React didn't mount)
      const root = document.getElementById('root');
      if (root && root.innerHTML === '') {
        document.body.innerHTML +=
          '<div style="color: red; padding: 20px; font-family: monospace; background: #fff0f0; border: 1px solid red; margin: 20px; z-index: 9999; position: relative;">' +
          '<h3>Global Error</h3>' +
          '<p><strong>Message:</strong> ' + message + '</p>' +
          '<p><strong>Source:</strong> ' + source + ':' + lineno + '</p>' +
          (error ? '<pre style="overflow:auto">' + error.stack + '</pre>' : '') +
          '</div>';
      }
    };
  </script>
</body>

</html>
